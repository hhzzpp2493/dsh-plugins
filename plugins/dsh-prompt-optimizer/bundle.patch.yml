# dsh-prompt-optimizer bundle patch：bundle 条目只贡献 patch 层，
# 插件本身必须由本补丁 insert 进配置树（否则不会加载）。
- insert:
    - id: dsh-prompt-optimizer
      name: dsh-prompt-optimizer
      config:
        provider: opencode-go
        model: deepseek-v4-flash
        # 可选兜底（仅当环境没有 llm 服务时的 OpenAI 兼容直连）：
        # apiKeyEnv: DEEPSEEK_API_KEY
        # baseUrl: https://api.deepseek.com
        # directModel: deepseek-chat