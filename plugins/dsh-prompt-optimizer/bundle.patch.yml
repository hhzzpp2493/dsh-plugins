# dsh-prompt-optimizer bundle 配置参考（profile 以 bundle 方式加载本插件时，
# 在 cordis.patch.yml 里以 id 覆盖形式配置；不再 insert 自身，避免重复加载）：
# - id: dsh-prompt-optimizer
#   config:
#     provider: opencode-go          # harness llm 服务的 provider 路由（缺省 opencode-go）
#     model: deepseek-v4-flash        # 优化用模型（缺省 deepseek-v4-flash）
# 可选兜底（仅当环境没有 llm 服务时的 OpenAI 兼容直连）：
#     apiKeyEnv: DEEPSEEK_API_KEY
#     baseUrl: https://api.deepseek.com
#     directModel: deepseek-chat